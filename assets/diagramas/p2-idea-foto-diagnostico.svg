<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <title id="t">Recorrido de un análisis</title>
  <desc id="d">Cinco pasos en fila: capturar, preparar, filtrar, clasificar con confianza, y explicar y mostrar. Desde filtrar sale una flecha hacia "No es una hoja", y desde clasificar otra hacia "No confirmado: otra foto o especialista".</desc>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4F6F52"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9A6B3F"/></marker>
  </defs>
  <rect width="680" height="300" fill="#F6F4EE"/>
  <g fill="#EAE5D9" stroke="#D5CEBE" stroke-width="2">
    <rect x="10" y="60" width="116" height="76" rx="8"/>
    <rect x="146" y="60" width="116" height="76" rx="8"/>
    <rect x="282" y="60" width="116" height="76" rx="8"/>
    <rect x="418" y="60" width="116" height="76" rx="8"/>
    <rect x="554" y="60" width="116" height="76" rx="8"/>
  </g>
  <g font-size="15" font-weight="700" fill="#2C2520" text-anchor="middle">
    <text x="68" y="92">1. Capturar</text>
    <text x="204" y="92">2. Preparar</text>
    <text x="340" y="92">3. Filtrar</text>
    <text x="476" y="92">4. Clasificar</text>
    <text x="612" y="92">5. Mostrar</text>
  </g>
  <g font-size="12.5" fill="#685B50" text-anchor="middle">
    <text x="68" y="113">foto + cultivo</text>
    <text x="204" y="113">JPEG sin EXIF</text>
    <text x="340" y="113">¿es una hoja?</text>
    <text x="476" y="113">+ confianza</text>
    <text x="612" y="113">mapa + ficha</text>
  </g>
  <g stroke="#4F6F52" stroke-width="2.5" marker-end="url(#f)">
    <line x1="127" y1="98" x2="143" y2="98"/>
    <line x1="263" y1="98" x2="279" y2="98"/>
    <line x1="399" y1="98" x2="415" y2="98"/>
    <line x1="535" y1="98" x2="551" y2="98"/>
  </g>
  <g stroke="#9A6B3F" stroke-width="2.5" marker-end="url(#g)" fill="none">
    <path d="M340 137 V 200"/>
    <path d="M476 137 V 200"/>
  </g>
  <g fill="#F3EADF" stroke="#9A6B3F" stroke-width="1.5">
    <rect x="262" y="204" width="156" height="58" rx="8"/>
    <rect x="430" y="204" width="236" height="58" rx="8"/>
  </g>
  <g font-size="13.5" fill="#2C2520" text-anchor="middle">
    <text x="340" y="229" font-weight="700">No es una hoja</text>
    <text x="340" y="248">pedir otra foto</text>
    <text x="548" y="229" font-weight="700">Resultado no confirmado</text>
    <text x="548" y="248">otra foto o especialista</text>
  </g>
  <text x="340" y="36" text-anchor="middle" font-size="14" fill="#685B50">Teléfono: pasos 1, 2 y 5 · Servidor de IA: pasos 3, 4 y el mapa de calor</text>
</svg>
