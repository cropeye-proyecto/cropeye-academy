<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <title id="t">Ciclo de vida de los tokens de sesión</title>
  <desc id="d">Secuencia entre la App y el Backend. 1: la App envía correo y contraseña a /auth/login y recibe un access token de 15 minutos y un refresh token. 2: cada petición lleva el access token. 3: cuando el Backend responde 401, la App envía el refresh token a /auth/refresh y recibe tokens nuevos. 4: al cerrar sesión, /auth/logout revoca el refresh token.</desc>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4F6F52"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#685B50"/></marker>
  </defs>
  <rect width="680" height="320" fill="#F6F4EE"/>
  <g fill="#EAE5D9" stroke="#D5CEBE" stroke-width="2">
    <rect x="30" y="15" width="120" height="40" rx="8"/>
    <rect x="530" y="15" width="120" height="40" rx="8"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="700" fill="#2C2520">
    <text x="90" y="41">App</text>
    <text x="590" y="41">Backend</text>
  </g>
  <g stroke="#D5CEBE" stroke-width="2" stroke-dasharray="4 4">
    <line x1="90" y1="56" x2="90" y2="305"/>
    <line x1="590" y1="56" x2="590" y2="305"/>
  </g>
  <g stroke-width="2.2" fill="none">
    <line x1="92" y1="80" x2="585" y2="80" stroke="#4F6F52" marker-end="url(#f)"/>
    <line x1="588" y1="108" x2="95" y2="108" stroke="#685B50" marker-end="url(#g)"/>
    <line x1="92" y1="148" x2="585" y2="148" stroke="#4F6F52" marker-end="url(#f)"/>
    <line x1="588" y1="188" x2="95" y2="188" stroke="#685B50" marker-end="url(#g)"/>
    <line x1="92" y1="214" x2="585" y2="214" stroke="#4F6F52" marker-end="url(#f)"/>
    <line x1="588" y1="240" x2="95" y2="240" stroke="#685B50" marker-end="url(#g)"/>
    <line x1="92" y1="280" x2="585" y2="280" stroke="#4F6F52" marker-end="url(#f)"/>
  </g>
  <g font-size="13" fill="#2C2520" text-anchor="middle">
    <text x="340" y="74">1. POST /auth/login · correo + contraseña</text>
    <text x="340" y="102">access (15 min) + refresh (días, guardado como hash)</text>
    <text x="340" y="142">2. cada petición · Authorization: Bearer access</text>
    <text x="340" y="182">401: el access expiró</text>
    <text x="340" y="208">3. POST /auth/refresh · refresh token</text>
    <text x="340" y="234">tokens nuevos · la App repite la petición una vez</text>
    <text x="340" y="274">4. POST /auth/logout · revoca el refresh</text>
  </g>
</svg>
