<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <title id="t">Cómo se construye el mapa de calor</title>
  <desc id="d">Cuatro etapas: la foto entra al modelo; en la última capa la imagen es una grilla de zonas; los gradientes de la enfermedad elegida indican qué zonas pesan más; esa grilla se amplía y se superpone en colores sobre la foto, con rojo en las lesiones.</desc>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4F6F52"/></marker>
    <radialGradient id="calor" cx="0.42" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#C0392B"/><stop offset="0.35" stop-color="#E5B53B"/><stop offset="0.7" stop-color="#7FB3D5"/><stop offset="1" stop-color="#3B5BA9"/>
    </radialGradient>
  </defs>
  <rect width="680" height="270" fill="#F6F4EE"/>
  <!-- 1 foto -->
  <rect x="20" y="50" width="130" height="130" rx="8" fill="#C9BFA5"/>
  <path d="M85 62 C 130 85, 132 150, 85 170 C 38 150, 40 85, 85 62 Z" fill="#739072"/>
  <circle cx="72" cy="105" r="9" fill="#685B50"/><circle cx="98" cy="128" r="6" fill="#685B50"/>
  <!-- 2 grilla -->
  <g stroke="#D5CEBE" stroke-width="2" fill="#EAE5D9">
    <rect x="195" y="70" width="90" height="90"/>
  </g>
  <g stroke="#D5CEBE" stroke-width="1.5">
    <line x1="225" y1="70" x2="225" y2="160"/><line x1="255" y1="70" x2="255" y2="160"/>
    <line x1="195" y1="100" x2="285" y2="100"/><line x1="195" y1="130" x2="285" y2="130"/>
  </g>
  <!-- 3 pesos -->
  <g>
    <rect x="330" y="70" width="90" height="90" fill="#EAE5D9" stroke="#D5CEBE" stroke-width="2"/>
    <rect x="330" y="70" width="30" height="30" fill="#E5B53B"/><rect x="360" y="70" width="30" height="30" fill="#E5B53B"/>
    <rect x="330" y="100" width="30" height="30" fill="#C0392B"/><rect x="360" y="100" width="30" height="30" fill="#C0392B"/>
    <rect x="390" y="100" width="30" height="30" fill="#7FB3D5"/><rect x="360" y="130" width="30" height="30" fill="#E5B53B"/>
  </g>
  <!-- 4 superpuesto -->
  <rect x="470" y="50" width="130" height="130" rx="8" fill="url(#calor)"/>
  <path d="M535 62 C 580 85, 582 150, 535 170 C 488 150, 490 85, 535 62 Z" fill="#739072" opacity="0.35"/>
  <g stroke="#4F6F52" stroke-width="2.5" marker-end="url(#f)">
    <line x1="152" y1="115" x2="190" y2="115"/>
    <line x1="287" y1="115" x2="325" y2="115"/>
    <line x1="422" y1="115" x2="465" y2="115"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="700" fill="#2C2520">
    <text x="85" y="32">1. Foto</text>
    <text x="240" y="32">2. Última capa</text>
    <text x="375" y="32">3. Gradientes</text>
    <text x="535" y="32">4. Mapa de calor</text>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#685B50">
    <text x="85" y="205">lo que analiza</text>
    <text x="85" y="221">el modelo</text>
    <text x="240" y="205">grilla de zonas con</text>
    <text x="240" y="221">patrones detectados</text>
    <text x="375" y="205">¿cuánto sube la clase</text>
    <text x="375" y="221">elegida en cada zona?</text>
    <text x="535" y="205">ampliado y en colores:</text>
    <text x="535" y="221">rojo = más influyó</text>
  </g>
  <text x="340" y="258" text-anchor="middle" font-size="13" fill="#685B50">Muestra dónde se apoyó la decisión, no si la decisión es correcta.</text>
</svg>
