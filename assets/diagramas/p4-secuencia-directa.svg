<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <title id="t">Secuencia del camino directo</title>
  <desc id="d">Cuatro participantes: persona, App, API de IA y almacenamiento del teléfono. La persona toma la foto; la App prepara el JPEG; la App envía POST /analisis; la API valida, filtra, clasifica y genera el mapa; responde 200 con JSON; la App guarda el análisis con escritura atómica; la App muestra el resultado a la persona.</desc>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4F6F52"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#685B50"/></marker>
  </defs>
  <rect width="680" height="400" fill="#F6F4EE"/>
  <g fill="#EAE5D9" stroke="#D5CEBE" stroke-width="2">
    <rect x="15" y="12" width="120" height="38" rx="8"/>
    <rect x="185" y="12" width="120" height="38" rx="8"/>
    <rect x="375" y="12" width="120" height="38" rx="8"/>
    <rect x="545" y="12" width="120" height="38" rx="8"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="700" fill="#2C2520">
    <text x="75" y="36">Persona</text>
    <text x="245" y="36">App</text>
    <text x="435" y="36">API de IA</text>
    <text x="605" y="36">Almacenamiento</text>
  </g>
  <g stroke="#D5CEBE" stroke-width="2" stroke-dasharray="4 4">
    <line x1="75" y1="51" x2="75" y2="385"/>
    <line x1="245" y1="51" x2="245" y2="385"/>
    <line x1="435" y1="51" x2="435" y2="385"/>
    <line x1="605" y1="51" x2="605" y2="385"/>
  </g>
  <rect x="236" y="100" width="18" height="34" fill="#E3EFE0" stroke="#5F8D4E"/>
  <rect x="426" y="168" width="18" height="96" fill="#E3EFE0" stroke="#5F8D4E"/>
  <g stroke-width="2.2" fill="none">
    <line x1="77" y1="80" x2="240" y2="80" stroke="#4F6F52" marker-end="url(#f)"/>
    <line x1="256" y1="160" x2="429" y2="160" stroke="#4F6F52" marker-end="url(#f)"/>
    <line x1="430" y1="290" x2="250" y2="290" stroke="#685B50" marker-end="url(#g)"/>
    <line x1="256" y1="330" x2="600" y2="330" stroke="#4F6F52" marker-end="url(#f)"/>
    <line x1="240" y1="368" x2="80" y2="368" stroke="#685B50" marker-end="url(#g)"/>
  </g>
  <g font-size="12.5" fill="#2C2520">
    <text x="82" y="73">1. foto + cultivo</text>
    <text x="262" y="118">2. preparar JPEG</text>
    <text x="262" y="134" fill="#685B50">sin EXIF, ≤1600 px</text>
    <text x="262" y="153">3. POST /analisis (multiparte)</text>
    <text x="452" y="186">4. validar tipo y tamaño</text>
    <text x="452" y="206">5. filtro: ¿es hoja?</text>
    <text x="452" y="226">6. modelo + cultivo</text>
    <text x="452" y="246">7. confiable + mapa</text>
    <text x="262" y="283">8. 200 · JSON</text>
    <text x="262" y="323">9. guardar (escritura atómica)</text>
    <text x="92" y="361">10. resultado o error</text>
  </g>
</svg>
